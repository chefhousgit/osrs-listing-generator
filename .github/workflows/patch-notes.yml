name: Patch notes

# Posts the "Patch notes:" sections of pushed commits to Discord (see .github/scripts/patch-notes.js).
on:
  push:
    branches: [main]
  # Run by hand (Actions tab, or: gh workflow run patch-notes.yml) to post patch-notes-history.md.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_PATCH_NOTES: ${{ secrets.DISCORD_WEBHOOK_PATCH_NOTES }}
        run: node .github/scripts/patch-notes.js
