name = "houbies-osrs-generator"
main = "worker.js"
compatibility_date = "2024-01-01"

# Discord alerts (alerts.js): check Eldorado every 5 minutes, 24/7.
[triggers]
crons = ["*/5 * * * *"]

# Remembers announced orders and when each offer was first seen.
# Create it once with:  npx wrangler kv namespace create STATE
# and paste the id it prints here.
[[kv_namespaces]]
binding = "STATE"
id = "8eefe3d441e34578bec3818c7cbbb217"

[vars]
# Daily summary goes out at this hour (24h clock) in this time zone.
TIMEZONE = "America/Los_Angeles"
SUMMARY_HOUR = "19"
# Expiry date of your Eldorado API credentials (YYYY-MM-DD), for the heads-up before they stop working.
ELDORADO_CREDS_EXPIRE = "2027-10-12"

# Secrets (never in this file), set each with:  npx wrangler secret put NAME
#   PROXY_SECRET, ANTHROPIC_API_KEY            (already set for the listing generator)
#   ELDORADO_CLIENT_ID, ELDORADO_CLIENT_SECRET
#   DISCORD_WEBHOOK_SALES, DISCORD_WEBHOOK_DISPUTES, DISCORD_WEBHOOK_SUMMARY, DISCORD_WEBHOOK_ERRORS
#   DISCORD_WEBHOOK_PRICE_DROPS (optional: auto price drops; otherwise #listed / #summary)
#   DISCORD_WEBHOOK_REVIEWS (optional: buyer reviews; otherwise #sales)
#   DISCORD_WEBHOOK_EXPIRING (optional: offers expiring within 2 days; otherwise #errors)
